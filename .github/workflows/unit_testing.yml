name: Unit testing for lab 5

on:
  pull_request_target:
    types: [assigned, opened, synchronize, reopened]
    branches:
      - 'main'
    paths:
      - 'lab_6/**'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout your fork
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    - name: Set env path
      run: |
        export PYTHONPATH=.:$PYTHONPATH:lab_6/

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "numpy<2"
        pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
        pip install torchtext==0.16.2 --index-url https://download.pytorch.org/whl/cpu
        pip install pandas Faker babel tqdm scikit-learn pytest pytest-mock coverage

    - name: Run tests
      run: |
       cd lab_6
       coverage run -m pytest tests/ -v

    - name: Calculate code coverage
      run: |
       coverage report
