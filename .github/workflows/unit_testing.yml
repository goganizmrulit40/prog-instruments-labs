name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ALL dependencies
      run: |
        python -m pip install --upgrade pip        
        pip install torch torchtext pandas
        pip install Faker babel tqdm scikit-learn
        pip install pytest pytest-mock coverage
        
        python -c "import torch; print(f'✅ PyTorch версия: {torch.__version__}')"
        python -c "import torchtext; print(f'✅ TorchText версия: {torchtext.__version__}')"
        python -c "import pandas; print(f'✅ pandas версия: {pandas.__version__}')"
        python -c "import Faker; print('✅ Faker установлен')"

    - name: Run tests
      run: |
        cd lab_6
        coverage run -m pytest tests/ -v